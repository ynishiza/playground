[project]
name = "airflow_playground"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.3",
    "fsspec>=2025.9.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "apache-airflow==3.3.1",
    "moto[s3,server]>=5.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]

[tool.ruff]
line-length = 100
src = ["airflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"
root = ["./airflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Postgres DB"]
